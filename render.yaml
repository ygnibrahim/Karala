# Render "Blueprint" ayarı: render.com → New → Blueprint → bu depoyu seç.
services:
  - type: web
    name: karala
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Sadece GitHub Actions kontrolleri (CI) geçince yayına al.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
