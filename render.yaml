# Render "Blueprint" ayarı: render.com → New → Blueprint → bu depoyu seç.
services:
  - type: web
    name: karala
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Otomatik yayın kapalı: yayını sadece CI/CD hattı (pipeline.yml → yayin işi) tetikler,
    # o da tüm güvenlik kontrolleri geçtikten ve "production" onayı verildikten sonra.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
