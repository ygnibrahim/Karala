<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Karala — Bağlantı yok</title>
    <style>
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff;
        background: linear-gradient(135deg, #6c4cf5, #3b82f6);
      }
      img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); }
      h1 { margin: 18px 0 6px; }
      p { margin: 0 0 20px; opacity: 0.9; }
      button {
        border: 0; border-radius: 14px; padding: 12px 22px; font-size: 1.05rem; font-weight: 700;
        background: #ff5c8a; color: #fff; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>İnternet bağlantısı yok</h1>
      <p>Karala arkadaşlarınla canlı oynandığı için internete ihtiyaç duyar.</p>
      <button onclick="location.reload()">Tekrar dene</button>
    </main>
  </body>
</html>
